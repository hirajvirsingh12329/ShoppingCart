<div class="mt-1">
    
    <p style="text-align: center; vertical-align:middle;"><strong>Template Form</strong></p>
    
    <form class="shadow rounded-2 p-2" style="background-color:lightgray" #templateRegistrationForm="ngForm"
        (ngSubmit)="onSubmit()">
        <div class="row ">
            <div class="form-group col-6">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control" name="firstname" ngModel placeholder="Firstname"
                    #firstName="ngModel" pattern="^[a-zA-Z0-9]+$" required>
                <!-- Validation Error Messages -->
                <div *ngIf="(firstName.touched || templateRegistrationForm.submitted) && firstName.invalid" class="error-msg">
                    <small *ngIf="firstName.errors?.['required']">First Name is required.</small>
                    <small *ngIf="firstName.errors?.['pattern']">Only alphanumeric values (letters and numbers) are
                        allowed.</small>
                </div>
            </div>

            <div class=" form-group col-6">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" name="lastname" ngModel placeholder="Last Name">
            </div>
        </div>
        <div class="row">
            <div class="form-group col-6">
                <label class="form-label">Country</label>
                <select class="form-select" (change)="onCountryChange()" id="country" name="country"
                    [(ngModel)]="selectedCountryCode">
                    <option selected value="">-- Select a Country --</option>
                    <option *ngFor="let country of countries" [value]="country.code">
                        {{ country.name}}
                    </option>
                </select>
            </div>
            <div class="form-group col-6">
                <label class="form-label">City</label>
                <select class="form-select" name="city" [disabled]="!selectedCountryCode"
                    [(ngModel)]="selectedCityCode">
                    <option selected value="">-- Select a city --</option>
                    <option *ngFor="let city of filtercities" [value]="city.code">
                        {{ city.name}}
                    </option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="form-group col-6">
                <label class="form-label">Gender</label>
                <input type="text" class="form-control" name="gender" ngModel placeholder="">
            </div>
            <div class="form-group col-6">
                <label class="form-label">Pincode</label>
                <input type="text" class="form-control" name="pincode" ngModel placeholder="Pin code">
            </div>
        </div>
        <div class="row">
            <div class="form-group col-6">
                <div>
                    <label class="form-check-label">Married</label>
                </div>
                <div>
                    <input type="checkbox" name="married" class="form-check-input" ngModel>
                </div>
            </div>
            <div class="form-group col-6">
                <label class="form-label">Date of birth</label>
                <input type="date" class="form-control" name="dateOfBirth" ngModel max="2026-07-27">
            </div>
        </div>
        <div class="row">
            <div class="form-group col-12">
                <label class="form-label">Address</label>
                <textarea type="text" class="form-control" name="address" ngModel rows="4" placeholder=""></textarea>
            </div>
        </div>
        <div class="row col-12 d-flex justify-content-center align-items-center" style="min-height: 100px;">
            <!-- The Save button is disabled if the form is invalid -->
            <button type="submit" [disabled]="templateRegistrationForm.invalid" class="btn btn-primary"
                style="width: 100px;">Submit</button>
            <button type="button" class="btn btn-secondary" (click)="onReset(templateRegistrationForm)"
                style="width: 130px;margin-left: 5px;">Reset Form</button>
        </div>
    </form>
</div>
